name: smart-harness

services:
  api:
    build:
      context: .
      dockerfile: control-plane/Dockerfile
      args:
        HARNESS_VERSION: ${HARNESS_VERSION:-dev}
        HARNESS_COMMIT: ${HARNESS_COMMIT:-unknown}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      # dev-login and the seed only exist with APP_ENV=local.
      APP_ENV: ${APP_ENV:-production}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (see .env.example)}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Validity of a new gateway token (shg_...), in days.
      GATEWAY_TOKEN_TTL_DAYS: ${GATEWAY_TOKEN_TTL_DAYS:-90}
      # Sent in the setup-plan: where the developer's coding agent reaches the gateway.
      GATEWAY_PUBLIC_URL: http://127.0.0.1:${GATEWAY_PORT:-8081}
      # Package archives. In production, unset S3_ENDPOINT to use AWS S3.
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: packages
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env (see .env.example)}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env (see .env.example)}
      # Resources of investimentos-api that the gateway may reach; make seed (APP_ENV=local) writes them to gateway_permissions.
      GITHUB_REPOS: ${GITHUB_REPOS:-}
      TRELLO_BOARD_ID: ${TRELLO_BOARD_ID:-}
      NOTION_PAGE_IDS: ${NOTION_PAGE_IDS:-}
    volumes:
      - sqlite-data:/data
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  gateway:
    build:
      context: .
      dockerfile: agent-gateway/Dockerfile
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8081}:8081"
    environment:
      # The echo test backend only exists with APP_ENV=local.
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Browser origins allowed to call /mcp, comma separated. Empty: any request with an Origin header is refused.
      ALLOWED_ORIGINS: ${GATEWAY_ALLOWED_ORIGINS:-}
      # Service credentials of the upstream systems. They stay in the gateway; a server whose credentials are empty is not served.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      TRELLO_API_KEY: ${TRELLO_API_KEY:-}
      TRELLO_TOKEN: ${TRELLO_TOKEN:-}
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      # The project server reads <root>/<project slug>/ (examples/investimentos-api).
      PROJECT_CONTEXT_ROOT: /project-context
      # Model proxy (POST /v1/messages). Without a key the route answers 503. The key never reaches the developer.
      MODEL_UPSTREAM_URL: ${MODEL_UPSTREAM_URL:-https://openrouter.ai/api}
      MODEL_UPSTREAM_KEY: ${MODEL_UPSTREAM_KEY:-}
    volumes:
      # Same file as the API: the gateway reads tokens and permissions and appends audit events.
      - sqlite-data:/data
      - ./examples:/project-context:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # S3-compatible object storage for the package archives. The upstream minio/minio image is no
  # longer published, so this uses Chainguard's build, pinned by digest.
  minio:
    image: cgr.dev/chainguard/minio@sha256:32c504bea4574d8f29d719b37bc0dad920ecf3e22b81dc5cea0bb105af2ce10f
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env (see .env.example)}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env (see .env.example)}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  sqlite-data:
  minio-data:
