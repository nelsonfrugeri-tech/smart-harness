name: smart-harness

services:
  api:
    build:
      context: .
      dockerfile: control-plane/Dockerfile
      args:
        HARNESS_VERSION: ${HARNESS_VERSION:-dev}
        HARNESS_COMMIT: ${HARNESS_COMMIT:-unknown}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - sqlite-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  gateway:
    build:
      context: .
      dockerfile: agent-gateway/Dockerfile
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8081}:8081"
    volumes:
      - sqlite-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  sqlite-data:
